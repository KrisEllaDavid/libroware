name: Deploy to Public Server

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.PUBLIC_SSH_KEY }}" | tr -d '\r' > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H ${{ secrets.PUBLIC_SERVER_HOST }} >> ~/.ssh/known_hosts
          ssh-keygen -l -f ~/.ssh/id_ed25519

      - name: Clone repo on server
        run: |
          ssh -i ~/.ssh/id_ed25519 -o StrictHostKeyChecking=yes -o ServerAliveInterval=60 ${{ secrets.PUBLIC_SERVER_USER }}@${{ secrets.PUBLIC_SERVER_HOST }} "
            set -e
            cd /home/${{ secrets.PUBLIC_SERVER_USER }}
            rm -rf libroware
            git clone https://github.com/KrisEllaDavid/libroware.git
          "

      - name: Write environment file
        env:
          ENV_FILE: ${{ secrets.PUBLIC_ENV_FILE }}
        run: |
          echo "$ENV_FILE" | ssh -i ~/.ssh/id_ed25519 -o StrictHostKeyChecking=yes ${{ secrets.PUBLIC_SERVER_USER }}@${{ secrets.PUBLIC_SERVER_HOST }} \
            "cat > /home/${{ secrets.PUBLIC_SERVER_USER }}/libroware/.env && chmod 600 /home/${{ secrets.PUBLIC_SERVER_USER }}/libroware/.env"

      - name: Start application
        run: |
          ssh -i ~/.ssh/id_ed25519 -o StrictHostKeyChecking=yes -o ServerAliveInterval=60 ${{ secrets.PUBLIC_SERVER_USER }}@${{ secrets.PUBLIC_SERVER_HOST }} "
            set -e
            cd /home/${{ secrets.PUBLIC_SERVER_USER }}/libroware
            chmod +x deploy.sh
            ./deploy.sh
          "
